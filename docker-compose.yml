x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    - AIRFLOW__CORE__FERNET_KEY=your-fernet-key-here-must-be-32-bytes
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
    - PYTHONPATH=/opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./config.toml:/opt/airflow/config.toml
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ===================
  # AIRFLOW SERVICES
  # ===================
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    profiles:
      - airflow

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    profiles:
      - airflow

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - airflow

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    profiles:
      - airflow

  # ===================
  # APP SERVICES
  # ===================
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  pipeline:
    build: .
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
    command: python -c "
      from src.pipeline import ingest_data, transform_data, optimize_portfolio;
      from src.storage import get_storage;
      storage = get_storage();
      print('=== INGEST ===');
      data = ingest_data();
      storage.save_raw(data);
      print('=== TRANSFORM ===');
      transform_data();
      print('=== OPTIMIZE ===');
      optimize_portfolio();
      print('=== DONE ===');
      "
    profiles:
      - pipeline

volumes:
  postgres-data:
