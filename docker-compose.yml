# =============================================================================
# ORCHESTRATION ARCHITECTURE
# =============================================================================
# AIRFLOW  = single authoritative orchestrator for all scheduled/daily runs.
#            DAG: ingest_incremental → transform → optimize → frontier → backtest
#            Runs daily at 00:00. Do NOT add cron jobs or extra pipeline
#            services that duplicate this work.
#
# PIPELINE = one-shot bootstrap service ONLY.
#            Use when: (1) initial setup with empty data/, or
#                      (2) new symbols added to config.toml (need full history).
#            Uses ingest_data() (full fetch, not incremental).
#            NOT a substitute for Airflow. NOT scheduled. Runs once then exits.
#            Profile: --profile pipeline
#
# Profiles quick reference:
#   (no profile)        api + streamlit (default runtime)
#   --profile pipeline  one-shot bootstrap (full ingest → transform → optimize → frontier → backtest)
#   --profile airflow   Airflow scheduler + webserver + postgres metadata DB
#   --profile benchmarks postgres-benchmarks only
#   --profile full      all of the above
# =============================================================================

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  env_file: .env
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/airflow
    - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_SECRET_KEY}
    - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
    - PYTHONPATH=/opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./config.toml:/opt/airflow/config.toml
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ===========================================================================
  # APP SERVICES (default — no profile needed)
  # ===========================================================================

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    profiles:
      - full

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - STREAMLIT_CLIENT_SHOW_ERROR_DETAILS=false
      - STREAMLIT_LOGGER_LEVEL=warning
      - STREAMLIT_SERVER_HEADLESS=true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    profiles:
      - full

  # ===========================================================================
  # BOOTSTRAP (--profile pipeline)
  # One-shot: runs once, exits. Use for initial setup or when adding new symbols.
  # After this completes, Airflow takes over for daily incremental updates.
  # ===========================================================================

  pipeline:
    build: .
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
      - ./scripts:/app/scripts:ro
    command: python scripts/bootstrap.py
    restart: "no"
    profiles:
      - pipeline

  # ===========================================================================
  # AIRFLOW — single orchestrator for daily scheduled runs (--profile airflow)
  # DAG: ingest_incremental → transform → optimize → frontier → backtest @ 00:00
  # ===========================================================================

  postgres:
    image: postgres:15
    env_file: .env
    environment:
      - POSTGRES_USER=${AIRFLOW_DB_USER}
      - POSTGRES_PASSWORD=${AIRFLOW_DB_PASSWORD}
      - POSTGRES_DB=airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    profiles:
      - airflow
      - full

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin \
          --password ${AIRFLOW_ADMIN_PASSWORD} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    restart: "no"
    profiles:
      - airflow

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - airflow
      - full

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    profiles:
      - airflow
      - full

  # ===========================================================================
  # BENCHMARKS DATABASE (--profile benchmarks)
  # PostgreSQL for benchmark index data (S&P 500, BTC buy-and-hold, etc.)
  # ===========================================================================

  postgres-benchmarks:
    image: postgres:15
    env_file: .env
    environment:
      - POSTGRES_USER=${BENCHMARKS_DB_USER}
      - POSTGRES_PASSWORD=${BENCHMARKS_DB_PASSWORD}
      - POSTGRES_DB=portfolio_benchmarks
    volumes:
      - benchmarks-data:/var/lib/postgresql/data
      - ./scripts/init-benchmarks.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "portfolio", "-d", "portfolio_benchmarks"]
      interval: 5s
      retries: 5
    profiles:
      - benchmarks
      - full

volumes:
  postgres-data:
  benchmarks-data:
