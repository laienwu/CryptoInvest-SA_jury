# =============================================================================
# ORCHESTRATION ARCHITECTURE
# =============================================================================
# AIRFLOW  = single authoritative orchestrator for all scheduled/daily runs.
#            DAG: ingest_incremental → transform → optimize → frontier → backtest
#            Runs daily at 00:00. Do NOT add cron jobs or extra pipeline
#            services that duplicate this work.
#
# PIPELINE = one-shot bootstrap service ONLY.
#            Use when: (1) initial setup with empty data/, or
#                      (2) new symbols added to config.toml (need full history).
#            Uses ingest_data() (full fetch, not incremental).
#            NOT a substitute for Airflow. NOT scheduled. Runs once then exits.
#            Profile: --profile pipeline
#
# Profiles quick reference:
#   (no profile)        api + streamlit (default runtime)
#   --profile pipeline  one-shot bootstrap (full ingest → transform → optimize → frontier → backtest)
#   --profile airflow   Airflow scheduler + webserver + postgres metadata DB
#   --profile benchmarks postgres-benchmarks only
#   --profile streaming  Redpanda (Kafka-compatible) + producer + consumer
#   --profile storage    MinIO (S3-compatible object storage)
#   --profile cache      Redis API cache
#   --profile monitoring Prometheus + Grafana observability
#   --profile full      all of the above
# =============================================================================

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  env_file: .env
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/airflow
    - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_SECRET_KEY}
    - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
    - PYTHONPATH=/opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./config.toml:/opt/airflow/config.toml
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ===========================================================================
  # APP SERVICES (default — no profile needed)
  # ===========================================================================

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    profiles:
      - api
      - full

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - STREAMLIT_CLIENT_SHOW_ERROR_DETAILS=false
      - STREAMLIT_LOGGER_LEVEL=warning
      - STREAMLIT_SERVER_HEADLESS=true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    profiles:
      - api
      - full

  # ===========================================================================
  # BOOTSTRAP (--profile pipeline)
  # One-shot: runs once, exits. Use for initial setup or when adding new symbols.
  # After this completes, Airflow takes over for daily incremental updates.
  # ===========================================================================

  pipeline:
    build: .
    user: "50000:0"
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
      - ./scripts:/app/scripts:ro
    command: python scripts/bootstrap.py
    restart: "no"
    profiles:
      - pipeline

  # ===========================================================================
  # AIRFLOW — single orchestrator for daily scheduled runs (--profile airflow)
  # DAG: ingest_incremental → transform → optimize → frontier → backtest @ 00:00
  # ===========================================================================

  postgres:
    image: postgres:15
    env_file: .env
    environment:
      - POSTGRES_USER=${AIRFLOW_DB_USER}
      - POSTGRES_PASSWORD=${AIRFLOW_DB_PASSWORD}
      - POSTGRES_DB=airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    profiles:
      - airflow
      - full

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin \
          --password ${AIRFLOW_ADMIN_PASSWORD} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    restart: "no"
    profiles:
      - airflow
      - full

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - airflow
      - full

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    profiles:
      - airflow
      - full

  # ===========================================================================
  # BENCHMARKS DATABASE (--profile benchmarks)
  # PostgreSQL for benchmark index data (S&P 500, BTC buy-and-hold, etc.)
  # ===========================================================================

  postgres-benchmarks:
    image: postgres:15
    env_file: .env
    environment:
      - POSTGRES_USER=${BENCHMARKS_DB_USER}
      - POSTGRES_PASSWORD=${BENCHMARKS_DB_PASSWORD}
      - POSTGRES_DB=portfolio_benchmarks
    volumes:
      - benchmarks-data:/var/lib/postgresql/data
      - ./scripts/init-benchmarks.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "portfolio", "-d", "portfolio_benchmarks"]
      interval: 5s
      retries: 5
    profiles:
      - benchmarks
      - full

  # ===========================================================================
  # OBJECT STORAGE — MinIO (S3-compatible) for cloud-native data lake
  # Use STORAGE_BACKEND=minio to route pipeline data through S3 API
  # ===========================================================================

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - storage
      - full

  # ===========================================================================
  # STREAMING — Redpanda (Kafka-compatible) for real-time ingestion
  # Binance WebSocket → Producer → Redpanda → Consumer → Bronze Parquet
  # ===========================================================================

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    command:
      - redpanda start
      - --smp 1
      - --memory 256M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - streaming

  redpanda-init:
    image: redpandadata/redpanda:v24.1.1
    entrypoint: /bin/bash
    command:
      - -c
      - |
        rpk topic create klines-raw \
          --brokers redpanda:9092 \
          --partitions 3 \
          --replicas 1 || true
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    profiles:
      - streaming

  stream-producer:
    build:
      context: .
      dockerfile: Dockerfile.streaming
    command: python -m src.pipeline.stream_producer
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
    volumes:
      - ./config.toml:/app/config.toml:ro
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles:
      - streaming

  stream-consumer:
    build:
      context: .
      dockerfile: Dockerfile.streaming
    command: python -m src.pipeline.stream_consumer
    user: "50000:0"
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles:
      - streaming

  redpanda-console:
    image: redpandadata/console:v2.6.0
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKERS=redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    profiles:
      - streaming

  # ===========================================================================
  # REDIS — API response cache (--profile cache)
  # ===========================================================================

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - cache
      - full

  # ===========================================================================
  # MONITORING — Prometheus + Grafana (--profile monitoring)
  # Scrapes FastAPI /prom/metrics, dashboards at Grafana :3000
  # ===========================================================================

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    profiles:
      - monitoring
      - full

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    profiles:
      - monitoring
      - full

volumes:
  postgres-data:
  benchmarks-data:
  redpanda-data:
  minio-data:
  redis-data:
  prometheus-data:
  grafana-data:
