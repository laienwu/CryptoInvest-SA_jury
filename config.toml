[portfolio]
symbols = [
    # Large caps
    "BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT", "XRPUSDT", "ADAUSDT",
    "DOGEUSDT", "AVAXUSDT", "DOTUSDT", "LINKUSDT", "ATOMUSDT", "FILUSDT",
    # Mid caps
    "POLUSDT", "NEARUSDT", "AAVEUSDT", "UNIUSDT", "LTCUSDT", "TRXUSDT",
    "ICPUSDT", "APTUSDT", "ARBUSDT", "OPUSDT", "SUIUSDT", "INJUSDT",
    "FETUSDT", "RUNEUSDT", "THETAUSDT", "ALGOUSDT", "VETUSDT", "SEIUSDT",
    # DeFi / Layer 2
    "GRTUSDT", "DYDXUSDT", "SNXUSDT", "WLDUSDT", "COMPUSDT",
    "SUSHIUSDT", "CRVUSDT", "LDOUSDT", "PENDLEUSDT", "ENSUSDT",
    # Meme / Small caps
    "SHIBUSDT", "PEPEUSDT", "FLOKIUSDT", "BOMEUSDT",
    # Gaming / Metaverse
    "SANDUSDT", "MANAUSDT", "AXSUSDT", "GALAUSDT", "IMXUSDT",
    # Infrastructure
    "RENDERUSDT", "HBARUSDT",
]
interval = "1m"
period_days = 30
risk_free_rate = 0.05
trading_days_per_year = 365
storage_backend = "parquet"

[yfinance]
symbols = [
    # US broad market
    "SPY", "QQQ", "IWM", "DIA",
    # International
    "EFA", "VGK", "EEM",
    # Bonds
    "TLT", "BND", "HYG",
    # Commodities
    "GLD", "SLV", "USO",
    # US sectors
    "XLF", "XLE", "XLK", "XLV",
    # Mega caps
    "AAPL", "MSFT", "GOOGL", "AMZN", "META", "NVDA", "TSLA",
    # Financials
    "JPM", "V", "GS",
    # Healthcare / Consumer
    "JNJ", "PG", "KO",
    # European
    "ASML.AS", "MC.PA", "SAP",
]
trading_days_per_year = 252
period_days = 365
risk_free_rate = 0.05

[symbol_selector]
# Daily Binance trading-universe builder. All keys are optional —
# omitting one falls back to the SymbolSelectorConfig default in src/config.py.
min_quote_volume = 50000000.0       # USD; liquidity floor
min_daily_range = 0.02              # (high - low) / low; 2% intraday range floor
min_abs_price_change_pct = 1.0      # |24h % change| floor
momentum_filter_enabled = true
top_n = 30
min_universe_size = 10              # below this, select_universe raises
quote_asset = "USDT"
leveraged_suffixes = ["UP", "DOWN", "BULL", "BEAR"]
stablecoin_blocklist = [
    "USDCUSDT", "BUSDUSDT", "FDUSDUSDT", "TUSDUSDT",
    "DAIUSDT", "USDPUSDT", "PAXGUSDT",
]
