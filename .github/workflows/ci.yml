name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install "uv>=0.9,<1"

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra optimize

      - name: Lint (ruff)
        run: uv run ruff check src/

      - name: Type check (mypy)
        run: uv run mypy src/

      - name: Tests
        run: uv run pytest tests/ -v --tb=short

      - name: Coverage
        run: uv run pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=50
