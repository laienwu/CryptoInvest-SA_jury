[project]
name = "binance-portfolio"
version = "0.1.0"
description = "Portfolio optimization with Binance crypto data - Data Engineer certification project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.4.4",
    "fastapi>=0.128.0",
    "pyarrow>=23.0.0",
    "requests>=2.32.5",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "ruff>=0.3.0",
    "mypy>=1.10.0",
]
optimize = [
    "scipy>=1.11.0",
]
dashboard = [
    "streamlit>=1.28.0",
    "plotly>=5.0.0",
    "pandas>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/dashboard/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["dags/", "tests/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length — formatter job
    "B008",   # Depends() in defaults — standard FastAPI pattern
    "B905",   # zip() without strict= — too noisy for math/data code
    "SIM108", # ternary — readability preference
]

[tool.mypy]
python_version = "3.13"
strict = false
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
    "pyarrow.*",
    "duckdb.*",
    "bs4.*",
    "psycopg2.*",
    "streamlit.*",
    "plotly.*",
    "airflow.*",
    "requests.*",
    "scipy.*",
    "pandas.*",
]
ignore_missing_imports = true
